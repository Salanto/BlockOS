name: Release

on:
  push:
    tags: ["v*"]

jobs:
  ci:
    uses: ./.github/workflows/ci.yml

  release:
    needs: ci
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5
      - uses: ./.github/actions/install-craftos
      - name: Build release assets
        run: tools/build.sh "${{ github.ref_name }}"
      - name: Publish the GitHub release
        uses: softprops/action-gh-release@v2
        with:
          # Tags like v0.1.0-rc1 become prereleases, so they never count as "latest".
          prerelease: ${{ contains(github.ref_name, '-') }}
          files: |
            dist/index.lua
            dist/*.pkg
            dist/install.lua
            dist/lz.lua
            dist/*.zip
