name: CI

on:
  push:
  pull_request:
  workflow_call:

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: lunarmodules/luacheck@v1

  test:
    # The CraftOS-PC PPA lists Ubuntu releases up to 23.04; 22.04 is the newest
    # GitHub runner it supports.
    runs-on: ubuntu-22.04
    strategy:
      fail-fast: false
      matrix:
        computer: [advanced, basic]
    steps:
      - uses: actions/checkout@v5
      - uses: ./.github/actions/install-craftos
      - name: Run tests on a ${{ matrix.computer }} computer
        run: tools/test.sh ${{ matrix.computer }}
      # A trial release build: proves the build still works and lists which packages
      # would count as changed against the latest release.
      - name: Trial build
        if: matrix.computer == 'advanced'
        run: tools/build.sh v0.0.0-ci
